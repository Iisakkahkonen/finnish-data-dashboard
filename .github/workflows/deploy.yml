name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly refresh, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Run pipeline tests
        run: python -m pytest -q data-pipeline/tests

      - name: Fetch latest Eurostat data
        run: python data-pipeline/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build site
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
