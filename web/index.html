<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finland vs. EU</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1 id="title">Finland vs. EU</h1>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fi">FI</button>
      </div>
    </header>

    <main>
      <section class="controls">
        <label class="control">
          <span data-i18n="indicator">Indicator</span>
          <select id="indicator-select"></select>
        </label>

        <div class="control">
          <span data-i18n="presets">Presets</span>
          <div id="presets" class="buttons"></div>
        </div>

        <div class="control">
          <span data-i18n="countries">Countries</span>
          <div id="country-chips" class="chips"></div>
        </div>

        <div class="control">
          <span data-i18n="view">View</span>
          <div class="lang-switch" role="group">
            <button type="button" data-view="chart" data-i18n="viewChart">Chart</button>
            <button type="button" data-view="table" data-i18n="viewTable">Table</button>
            <button type="button" data-view="gap" data-i18n="viewGap">Finland's gap</button>
          </div>
        </div>

        <div class="control">
          <span data-i18n="shareExport">Share and export</span>
          <div class="actions">
            <div class="lang-switch" role="group">
              <button type="button" id="copy-link" data-i18n="copyLink">Copy link</button>
              <button type="button" id="download-csv" data-i18n="downloadCsv">Download CSV</button>
            </div>
            <span id="action-feedback" class="action-feedback" role="status"></span>
          </div>
        </div>
      </section>

      <details id="explain" class="explain">
        <summary data-i18n="explainTitle">What does this number mean?</summary>
        <p id="explain-text"></p>
      </details>

      <p id="note" class="note" hidden></p>

      <div id="year-controls" class="year-controls" hidden>
        <button type="button" id="year-prev" data-i18n="prevYear">Previous year</button>
        <input type="range" id="year-slider" min="0" max="0" step="1" value="0" aria-label="Year" />
        <button type="button" id="year-next" data-i18n="nextYear">Next year</button>
        <span id="year-value" class="year-value" aria-live="polite"></span>
      </div>

      <div id="range-controls" class="year-controls" hidden>
        <span data-i18n="rangeFrom">From</span>
        <input type="range" id="range-from" min="0" max="0" step="1" value="0" aria-label="Start year" />
        <span id="range-from-value" class="year-value"></span>
        <span data-i18n="rangeTo">To</span>
        <input type="range" id="range-to" min="0" max="0" step="1" value="0" aria-label="End year" />
        <span id="range-to-value" class="year-value"></span>
      </div>

      <div id="chart-wrap" class="chart-wrap">
        <canvas id="chart" aria-label="Line chart"></canvas>
      </div>

      <div id="table-wrap" class="table-wrap" hidden></div>

      <p id="status" class="status" role="status"></p>
      <details class="sources">
        <summary data-i18n="sourcesTitle">Sources and method</summary>
        <ul>
          <li>
            <strong data-i18n="indicators.unemployment"></strong>
            <span data-i18n="sources.unemployment"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/une_rt_a/default/table?lang=en" target="_blank" rel="noopener">une_rt_a</a>
          </li>
          <li>
            <strong data-i18n="indicators.inflation"></strong>
            <span data-i18n="sources.inflation"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_aind/default/table?lang=en" target="_blank" rel="noopener">prc_hicp_aind</a>
          </li>
          <li>
            <strong data-i18n="indicators.gdp_per_capita"></strong>
            <span data-i18n="sources.gdp_per_capita"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/tec00114/default/table?lang=en" target="_blank" rel="noopener">tec00114</a>
          </li>
          <li>
            <strong data-i18n="indicators.at_risk_of_poverty"></strong>
            <span data-i18n="sources.at_risk_of_poverty"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/ilc_li02/default/table?lang=en" target="_blank" rel="noopener">ilc_li02</a>
          </li>
          <li>
            <strong data-i18n="indicators.pisa_reading"></strong>
            <span data-i18n="sources.pisa"></span>
          </li>
          <li>
            <strong data-i18n="indicators.pisa_science"></strong>
            <span data-i18n="sources.pisa"></span>
          </li>
          <li>
            <strong data-i18n="indicators.life_expectancy"></strong>
            <span data-i18n="sources.lifeexp"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/demo_mlexpec/default/table?lang=en" target="_blank" rel="noopener">demo_mlexpec</a>
          </li>
          <li>
            <strong data-i18n="indicators.gini"></strong>
            <span data-i18n="sources.gini"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/ilc_di12/default/table?lang=en" target="_blank" rel="noopener">ilc_di12</a>
          </li>
          <li>
            <strong data-i18n="indicators.median_income_pps"></strong>
            <span data-i18n="sources.median_income_pps"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/ilc_di03/default/table?lang=en" target="_blank" rel="noopener">ilc_di03</a>
          </li>
          <li>
            <strong data-i18n="indicators.median_income_eur"></strong>
            <span data-i18n="sources.median_income_eur"></span>
            <a href="https://ec.europa.eu/eurostat/databrowser/view/ilc_di03/default/table?lang=en" target="_blank" rel="noopener">ilc_di03</a>
          </li>
          <li>
            <strong data-i18n="indicators.pisa_math"></strong>
            <span data-i18n="sources.pisa"></span>
            <a href="https://www.oecd.org/en/publications/pisa-2022-results-volume-i_53f23881-en.html" target="_blank" rel="noopener">OECD PISA 2022</a>,
            <a href="https://datahub.io/society-and-living-standards/pisa-education-performance" target="_blank" rel="noopener">DataHub</a>
          </li>
        </ul>
        <p class="sources-licence" data-i18n="sources.licence"></p>
      </details>
    </main>

    <footer>
      <p id="footer-source"></p>
      <p id="footer-updated"></p>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
